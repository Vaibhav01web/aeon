[project]
name = "urms"
version = "0.1.0"
description = "Aeon: AI-powered Urban Resource Management System for Indian cities"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5.5",
    "h3>=4.5.0",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "xarray>=2026.7.0",
    "odc-stac>=0.5.3",
    "pystac-client>=0.9.0",
    "lightgbm>=4.7.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.9.0",
    "statsforecast>=2.1.1",
    "ortools>=9.15.6755",
    "libpysal>=4.14.1",
    "esda>=2.9.0",
    "pmtiles>=3.7.0",
    "typer",
    "pyyaml",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest", "folium", "matplotlib"]

[project.scripts]
urms = "urms.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
