city:
  name: "Pune"
  slug: "pune"
  state: "Maharashtra"
  state_code: "MH"
  ulb_name: "Pune Municipal Corporation + Pimpri-Chinchwad Municipal Corporation"
  lgd_code: null
  bbox: [73.60, 18.38, 74.12, 18.80]   # whole Pune metro: PMC + PCMC + Hinjewadi, Talegaon, Chakan, Wagholi fringe
  utm_crs: "EPSG:32643"
  timezone: "Asia/Kolkata"
  population_total: 4852150       # Census 2011: PMC 3,124,458 + PCMC 1,727,692 — the IPF anchor; fringe villages outside both ULBs are not in it
  population_year: 2011
  population_growth_rate: 0.021   # CAGR; ASSUMED unless replaced with a cited figure
  area_km2: 512.26                # 2011 municipal areas: PMC 331.26 + PCMC 181
  ward_population_csv: null

zones:
  h3_res_model: 8
  h3_res_display: 9
  use_wards: true
  min_footprints_per_zone: 5
  min_building_area_m2: 12        # drop sheds / low-confidence detections below this footprint
  urban_min_density_per_km2: 400  # map shows zones at or above this; Census of India urban density criterion

sentinel:
  date_start: "2026-01-01"
  date_end: "2026-03-31"
  baseline_start: "2019-01-01"
  baseline_end: "2019-03-31"
  max_cloud_cover: 20
  bands: ["red", "green", "blue", "nir", "swir16", "scl"]
  resolution: 10

resources: ["water", "electricity", "waste"]

forecast:
  horizon_hours: 72
  quantiles: [0.1, 0.5, 0.9]
  temporal_model: "MSTL"
  seasonality: [24, 168]

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  build: "build"
