# ⚠️ bbox is an approximate BBMP-area box — tighten against the actual ULB
# boundary before relying on footprint counts. population_total is the
# Census 2011 Bengaluru Urban Agglomeration figure; cross-check against the
# BBMP ULB-only figure before use (they differ).
city:
  name: "Bengaluru"
  slug: "bengaluru"
  state: "Karnataka"
  state_code: "KA"
  ulb_name: "Bruhat Bengaluru Mahanagara Palike"
  lgd_code: null
  bbox: [77.45, 12.85, 77.75, 13.15]
  utm_crs: "EPSG:32643"           # 72–78E zone; Bengaluru at 77.6E is inside it
  timezone: "Asia/Kolkata"
  population_total: 8443675       # Census 2011, Bengaluru UA — VERIFY before quoting
  population_year: 2011
  population_growth_rate: 0.031   # ASSUMED — higher-growth metro, not independently sourced
  area_km2: 741.0
  ward_population_csv: null

zones:
  h3_res_model: 8
  h3_res_display: 9
  use_wards: true
  min_footprints_per_zone: 5
  min_building_area_m2: 12        # drop sheds / low-confidence detections below this footprint
  urban_min_density_per_km2: 400  # map shows zones at or above this; Census of India urban density criterion

sentinel:
  date_start: "2026-01-01"
  date_end: "2026-03-31"
  baseline_start: "2019-01-01"
  baseline_end: "2019-03-31"
  max_cloud_cover: 20
  bands: ["red", "green", "blue", "nir", "swir16", "scl"]
  resolution: 10

resources: ["water", "electricity", "waste"]

forecast:
  horizon_hours: 72
  quantiles: [0.1, 0.5, 0.9]
  temporal_model: "MSTL"
  seasonality: [24, 168]

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  build: "build"
