<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pravah Resource Flows</title>
  <!-- maplibre-gl v6 is ESM-only (no UMD dist/maplibre-gl.js); v5 is the last UMD line. -->
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css?v=6f4a9a0a" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <!-- deck.gl's standalone bundle expects h3-js as the global `h3`; H3HexagonLayer fails without it. -->
  <script src="https://cdn.jsdelivr.net/npm/h3-js@4.5.0/dist/h3-js.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
</head>
<body>
  <main id="dash">
    <header class="dash-head">
      <div>
        <h1>Pravah <span id="city-name"></span></h1>
        <p class="sub">Plan the city's flows — water, power and waste, ward by ward. Open data, ₹0.</p>
      </div>
    </header>

    <section class="controls card">
      <div class="seg tabs" role="tablist" aria-label="Resource">
        <button type="button" role="tab" data-resource="water" aria-selected="true">Water</button>
        <button type="button" role="tab" data-resource="electricity" aria-selected="false">Electricity</button>
        <button type="button" role="tab" data-resource="waste" aria-selected="false">Waste</button>
      </div>
      <div class="row2">
        <label>Layer
          <select id="layer">
            <option value="risk">Risk</option>
            <option value="demand">Demand</option>
            <option value="capacity">Capacity</option>
            <option value="gap">Gap</option>
            <option value="population">Population</option>
          </select>
        </label>
        <label>Scenario
          <select id="scenario"></select>
        </label>
      </div>
    </section>

    <div class="cards">
      <section class="card hero">
        <span class="eyebrow" id="hero-label">City demand</span>
        <div class="hero-row">
          <span class="hero-value" id="hero-value">—</span>
          <span class="delta" id="hero-delta" hidden></span>
        </div>
        <p class="hero-sub" id="hero-sub"></p>
      </section>

      <section class="card" id="legend"></section>

      <section class="card" id="top-card">
        <h2 id="top-title">Riskiest zones</h2>
        <ol id="top-list"></ol>
      </section>

      <section class="card" id="zone-card">
        <h2>Selected zone</h2>
        <p class="hint">Click a hexagon on the map, or a zone in the list.</p>
      </section>

      <section class="card" id="climate">
        <h2>Climate impact <span class="muted">tCO₂e / year</span></h2>
        <div id="climate-bars"></div>
      </section>
    </div>

    <details class="card">
      <summary>How it works</summary>
      <p class="notice" id="notice"></p>
    </details>
    <details class="card">
      <summary>Sources</summary>
      <p class="notice" id="attribution"></p>
    </details>
  </main>

  <div id="map-pane">
    <div id="map"></div>
    <div id="map-controls" role="group" aria-label="Map settings">
      <div class="seg small">
        <button type="button" data-basemap="streets" aria-pressed="false">Map</button>
        <button type="button" data-basemap="satellite" aria-pressed="true">Satellite</button>
        <button type="button" data-basemap="sentinel2" aria-pressed="false">Sentinel-2</button>
      </div>
      <label class="opacity">Opacity
        <input id="opacity" type="range" min="0.15" max="1" step="0.05" value="0.55">
      </label>
    </div>
  </div>

  <script src="app.js?v=6f4a9a0a"></script>
</body>
</html>
