<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aeon Resource Planner</title>
  <!-- maplibre-gl v6 is ESM-only (no UMD dist/maplibre-gl.js); v5 is the last UMD line. -->
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <!-- deck.gl's standalone bundle expects h3-js as the global `h3`; H3HexagonLayer fails without it. -->
  <script src="https://cdn.jsdelivr.net/npm/h3-js@4.5.0/dist/h3-js.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header id="panel-head">
      <h1>Aeon <span id="city-name"></span></h1>
      <button id="toggle" class="ghost" type="button" aria-expanded="true" aria-controls="panel-body">Hide</button>
    </header>

    <div id="panel-body">
      <div class="seg tabs" role="tablist" aria-label="Resource">
        <button type="button" role="tab" data-resource="water" aria-selected="true">Water</button>
        <button type="button" role="tab" data-resource="electricity" aria-selected="false">Electricity</button>
        <button type="button" role="tab" data-resource="waste" aria-selected="false">Waste</button>
      </div>

      <div class="row2">
        <label>Layer
          <select id="layer">
            <option value="risk">Risk</option>
            <option value="demand">Demand</option>
            <option value="capacity">Capacity</option>
            <option value="gap">Gap</option>
            <option value="population">Population</option>
          </select>
        </label>
        <label>Scenario
          <select id="scenario"></select>
        </label>
      </div>

      <section class="hero">
        <span class="eyebrow" id="hero-label">City demand</span>
        <div class="hero-row">
          <span class="hero-value" id="hero-value">—</span>
          <span class="delta" id="hero-delta" hidden></span>
        </div>
      </section>

      <section id="legend"></section>

      <section id="zone-card" hidden></section>
      <p class="hint" id="hint">Tap a hexagon for details.</p>

      <details id="climate">
        <summary>Climate impact <span class="muted">tCO₂e / yr</span></summary>
        <div id="climate-bars"></div>
      </details>
      <details>
        <summary>How it works</summary>
        <p class="notice" id="notice"></p>
      </details>
      <details>
        <summary>Sources</summary>
        <p class="notice" id="attribution"></p>
      </details>
    </div>
  </aside>

  <div id="map-controls" role="group" aria-label="Map settings">
    <div class="seg small">
      <button type="button" data-basemap="streets" aria-pressed="true">Map</button>
      <button type="button" data-basemap="satellite" aria-pressed="false">Satellite</button>
      <button type="button" data-basemap="sentinel2" aria-pressed="false">Sentinel-2</button>
    </div>
    <label class="opacity">Opacity
      <input id="opacity" type="range" min="0.15" max="1" step="0.05" value="0.72">
    </label>
  </div>

  <script src="app.js"></script>
</body>
</html>
