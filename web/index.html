<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aeon Resource Planner</title>
  <!-- maplibre-gl v6 is ESM-only (no UMD dist/maplibre-gl.js); v5 is the last UMD line. -->
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <!-- deck.gl's standalone bundle expects h3-js as the global `h3`; H3HexagonLayer fails without it. -->
  <script src="https://cdn.jsdelivr.net/npm/h3-js@4.5.0/dist/h3-js.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header id="panel-head">
      <div>
        <h1>Aeon <span id="city-name"></span></h1>
        <p class="sub">Neighbourhood demand, capacity and shortage risk — open data, ₹0.</p>
      </div>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="panel-body">Hide</button>
    </header>

    <div id="panel-body">
      <div class="controls">
        <label>Resource
          <select id="resource">
            <option value="water">Water</option>
            <option value="electricity">Electricity</option>
            <option value="waste">Waste</option>
          </select>
        </label>
        <label>Layer
          <select id="layer">
            <option value="risk">Shortage risk</option>
            <option value="demand">Demand (P50)</option>
            <option value="capacity">Capacity</option>
            <option value="gap">Gap (P90 − capacity)</option>
            <option value="population">Population</option>
          </select>
        </label>
        <label class="wide">Scenario
          <select id="scenario"></select>
        </label>
        <div class="wide basemap" role="group" aria-label="Basemap">
          <span class="basemap-label">Basemap</span>
          <div class="seg">
            <button type="button" data-basemap="streets" aria-pressed="true">Map</button>
            <button type="button" data-basemap="satellite" aria-pressed="false">Satellite</button>
            <button type="button" data-basemap="sentinel2" aria-pressed="false">Sentinel-2</button>
          </div>
        </div>
      </div>

      <div id="totals"></div>

      <div id="legend">
        <span><i style="background:#fdd49e"></i>low</span>
        <span><i style="background:#fc8d59"></i>medium</span>
        <span><i style="background:#d7301f"></i>high</span>
        <span><i style="background:#7f0000"></i>critical</span>
        <span><i style="background:#b8b8b8"></i>no mapped capacity</span>
      </div>

      <section id="zone-card" hidden></section>
      <p class="hint" id="hint">Tap a hexagon for details.</p>

      <details id="climate">
        <summary>Climate impact (tCO₂e / year)</summary>
        <div id="climate-bars"></div>
      </details>

      <details>
        <summary>How these numbers are made</summary>
        <p class="notice" id="notice"></p>
      </details>

      <details>
        <summary>Data sources &amp; attribution</summary>
        <p class="notice" id="attribution"></p>
      </details>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
